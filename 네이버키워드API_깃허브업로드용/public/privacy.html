<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인정보 처리 안내</title>
</head>
<body>
  <main style="max-width:720px;margin:48px auto;font-family:sans-serif;line-height:1.7;padding:0 20px">
    <h1>개인정보 처리 안내</h1>
    <p>이 API는 네이버 검색광고 키워드 통계를 조회하기 위해 사용자가 입력한 키워드만 처리합니다.</p>
    <p>애플리케이션 코드는 키워드, 대화 내용, 사용자 식별정보를 별도 데이터베이스에 저장하지 않습니다. 다만 호스팅 제공업체가 보안과 운영을 위해 일반적인 접속 로그를 처리할 수 있습니다.</p>
    <p>네이버 API 인증정보는 서버 환경변수에만 저장되며 GPT 지침이나 응답에 노출되지 않습니다.</p>
    <p>문의: 이 페이지를 운영하는 GPT 소유자의 연락처를 여기에 추가하세요.</p>
  </main>
</body>
</html>
