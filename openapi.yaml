openapi: 3.1.0
info:
  title: 예디 네이버 키워드 조회 API
  version: 1.0.0
  description: 네이버 검색광고 키워드 도구에서 월간 검색량과 연관 키워드를 조회합니다.
servers:
  - url: https://api-blog-five-phi.vercel.app
paths:
  /api/keywords:
    post:
      operationId: researchNaverKeywords
      summary: 네이버 키워드 검색량과 연관 키워드 조회
      description: |
        글 주제와 관련된 후보 키워드 1~5개를 조회합니다.
        반환된 advertisingCompetition은 검색광고 경쟁도이며 블로그 경쟁도가 아닙니다.
        '< 10' 검색량은 정확한 숫자로 해석하지 않습니다.
      x-openai-isConsequential: false
      security:
        - ActionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - seeds
              properties:
                seeds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: 공백을 포함해도 되는 한국어 후보 키워드
                  items:
                    type: string
                    minLength: 1
                    maxLength: 50
                  examples:
                    - ["결혼식 계절", "가을 결혼식", "9월 결혼식"]
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                  description: 반환할 연관 키워드 최대 개수
      responses:
        "200":
          description: 키워드 조사 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  generatedAt:
                    type: string
                  seeds:
                    type: array
                    items:
                      type: string
                  interpretationNotes:
                    type: array
                    items:
                      type: string
                  exactMatches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Keyword"
                  relatedKeywords:
                    type: array
                    items:
                      $ref: "#/components/schemas/Keyword"
        "400":
          description: 잘못된 요청
        "401":
          description: Action 인증 실패
        "500":
          description: 서버 설정 또는 내부 오류
        "504":
          description: 네이버 API 응답 시간 초과
components:
  securitySchemes:
    ActionKey:
      type: apiKey
      in: header
      name: X-Action-Key
  schemas:
    Keyword:
      type: object
      properties:
        keyword:
          type: string
        monthlyPcSearchRaw:
          oneOf:
            - type: string
            - type: number
        monthlyMobileSearchRaw:
          oneOf:
            - type: string
            - type: number
        monthlyPcSearchApprox:
          type: number
        monthlyMobileSearchApprox:
          type: number
        monthlyTotalSearchApprox:
          type: number
        containsRangeValue:
          type: boolean
        monthlyAveragePcClicks:
          oneOf:
            - type: number
            - type: "null"
        monthlyAverageMobileClicks:
          oneOf:
            - type: number
            - type: "null"
        monthlyAveragePcCtr:
          oneOf:
            - type: number
            - type: "null"
        monthlyAverageMobileCtr:
          oneOf:
            - type: number
            - type: "null"
        averageAdDepth:
          oneOf:
            - type: number
            - type: "null"
        advertisingCompetition:
          oneOf:
            - type: string
            - type: "null"
